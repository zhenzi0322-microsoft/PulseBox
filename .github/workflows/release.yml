name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要创建 / 更新的 Release tag（手动触发时填写；tag 推送触发可留空）'
        required: false
        default: ''
        type: string   # 显式声明单行文本框，网页显示输入框

# 同一分支/PR 的重复触发自动取消旧运行，节省 CI 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---- Windows：桌面端 + 核心库全量构建 ----
  windows:
    runs-on: windows-latest
    steps:
      - name: Clone Codeup private repo into demo
        env:
          CODEUP_TOKEN: ${{ secrets.CODEUP_TOKEN }}
        run: |
          git clone "https://oauth2:${env:CODEUP_TOKEN}@codeup.aliyun.com/zheniz0322/Rust/tauri/PulseBox.git" demo
        shell: pwsh
      
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: 20
      
      # - name: node install
      #   working-directory: demo
      #   run: |
      #     npm install
      #     npm run build
      #     cargo test --workspace 

      # - name: 构建 Agent 与桌面端
      #   working-directory: demo
      #   run: cargo build --release -p pulsebox-agent -p pulsebox-desktop
            # tauri build 会先执行 beforeBuildCommand（npm run build）编译前端，
      # 再编译 pulsebox-desktop，最后按 tauri.conf.json 的 bundle.targets
      # 生成 NSIS(.exe) 与 MSI(.msi) 安装包到
      # src-tauri/target/release/bundle/{nsis,msi}/。
      - name: 打包 Windows 桌面端应用（NSIS + MSI 安装包）
        working-directory: demo
        run: npm install && npm run tauri build

      # 如需对安装包做代码签名（消除 SmartScreen 拦截），可在上方步骤前配置
      # Windows 代码签名证书（secrets），并在 tauri.conf.json 的
      # bundle.windows 中填写签名参数；此处保持未签名构建。
      # - name: 上传 Windows 安装包产物
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: PulseBox ${{ inputs.tag_name || github.ref_name }}
      #     path: |
      #       demo/target/release/bundle/nsis/*
      #       demo/target/release/bundle/msi/*
      #     if-no-files-found: error

      # 从 demo/docs/RELEASE_NOTES.md 按本次版本号取出更新说明，供下方发布步骤的 body 使用
      # （发版只改 RELEASE_NOTES.md，在顶部加一节 `## v<版本号>`，不动本文件）。
      # 用 bash 调 node，跨平台通用。版本号优先取本次 tag（inputs.tag_name || github.ref_name），
      # 退回 src-tauri/tauri.conf.json 的 version；两者在 RELEASE_NOTES.md 里都找不到对应小节则失败退出。
      - name: Resolve release notes
        id: relnotes
        working-directory: demo
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/relnotes.cjs" <<'NODE_EOF'
          const fs = require("fs");
          const file = "docs/RELEASE_NOTES.md";
          if (!fs.existsSync(file)) {
            console.error("::error::找不到 " + file + "，无法生成更新说明。");
            process.exit(1);
          }
          const raw = fs.readFileSync(file, "utf8").replace(/^\uFEFF/, "");
          const candidates = [];
          const tag = (process.env.RELEASE_TAG || "").trim();
          if (tag) candidates.push(tag.replace(/^v/i, ""));
          try {
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8").replace(/^\uFEFF/, ""));
            if (conf.version) candidates.push(String(conf.version).replace(/^v/i, ""));
          } catch (e) {}
          const uniq = [...new Set(candidates)].filter(Boolean);
          function extract(ver) {
            const lines = raw.split(/\r?\n/);
            const esc = ver.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const head = new RegExp("^##\\s+v?" + esc + "\\s*$", "i");
            let start = -1;
            for (let i = 0; i < lines.length; i++) { if (head.test(lines[i].trim())) { start = i + 1; break; } }
            if (start < 0) return null;
            const out = [];
            for (let i = start; i < lines.length; i++) { if (/^#{1,2}\s/.test(lines[i])) break; out.push(lines[i]); }
            return out.join("\n").trim();
          }
          let body = null, used = "";
          for (const c of uniq) { const b = extract(c); if (b) { body = b; used = c; break; } }
          if (!body) {
            console.error("::error::在 " + file + " 中找不到版本 [" + uniq.join(", ") + "] 对应的更新小节（应为「## v<版本号>」标题）。");
            process.exit(1);
          }
          const full = "# PulseBox v" + used + "\n\n" + body + "\n";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "body<<__RN_EOF__\n" + full + "__RN_EOF__\n");
          console.log("release notes resolved for v" + used + " (" + full.length + " chars)");
          NODE_EOF
          node "$RUNNER_TEMP/relnotes.cjs"

      - name: Push Release
        uses: softprops/action-gh-release@v3
        with:
          name: PulseBox ${{ inputs.tag_name || github.ref_name }}
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            demo/target/release/bundle/nsis/*
          generate_release_notes: false
          body: ${{ steps.relnotes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Ubuntu：把 pulsebox-agent 打包成 .deb，可直接在服务器安装运行 ----
  ubuntu-agent-deb:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库：与 Windows 作业完全一致的方式（Codeup 私有仓 → demo），保持不变
      - name: Clone Codeup private repo into demo
        env:
          CODEUP_TOKEN: ${{ secrets.CODEUP_TOKEN }}
        run: |
          git clone "https://oauth2:${CODEUP_TOKEN}@codeup.aliyun.com/zheniz0322/Rust/tauri/PulseBox.git" demo

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential pkg-config ca-certificates curl dpkg-dev

      - uses: dtolnay/rust-toolchain@stable

      # Agent 是纯 HTTP/WS 服务，使用 rustls（见 build-deb.sh），无需 libssl-dev
      # - name: 运行 Agent / Core 单元测试（Linux 路径校验）
      #   working-directory: demo
      #   run: cargo test -p pulsebox-agent -p pulsebox-core

      - name: 构建并打包 Agent (.deb)
        working-directory: demo
        env:
          VERSION: ${{ inputs.tag_name || github.ref_name }}
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      # 与 Windows 作业同源：从 demo/docs/RELEASE_NOTES.md 按版本号抽取更新说明，
      # 作为 .deb 发布步骤的 body（发版只改 RELEASE_NOTES.md，不动本文件）。
      - name: Resolve release notes
        id: relnotes
        working-directory: demo
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/relnotes.cjs" <<'NODE_EOF'
          const fs = require("fs");
          const file = "docs/RELEASE_NOTES.md";
          if (!fs.existsSync(file)) {
            console.error("::error::找不到 " + file + "，无法生成更新说明。");
            process.exit(1);
          }
          const raw = fs.readFileSync(file, "utf8").replace(/^\uFEFF/, "");
          const candidates = [];
          const tag = (process.env.RELEASE_TAG || "").trim();
          if (tag) candidates.push(tag.replace(/^v/i, ""));
          try {
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8").replace(/^\uFEFF/, ""));
            if (conf.version) candidates.push(String(conf.version).replace(/^v/i, ""));
          } catch (e) {}
          const uniq = [...new Set(candidates)].filter(Boolean);
          function extract(ver) {
            const lines = raw.split(/\r?\n/);
            const esc = ver.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            const head = new RegExp("^##\\s+v?" + esc + "\\s*$", "i");
            let start = -1;
            for (let i = 0; i < lines.length; i++) { if (head.test(lines[i].trim())) { start = i + 1; break; } }
            if (start < 0) return null;
            const out = [];
            for (let i = start; i < lines.length; i++) { if (/^#{1,2}\s/.test(lines[i])) break; out.push(lines[i]); }
            return out.join("\n").trim();
          }
          let body = null, used = "";
          for (const c of uniq) { const b = extract(c); if (b) { body = b; used = c; break; } }
          if (!body) {
            console.error("::error::在 " + file + " 中找不到版本 [" + uniq.join(", ") + "] 对应的更新小节（应为「## v<版本号>」标题）。");
            process.exit(1);
          }
          const full = "# PulseBox v" + used + "\n\n" + body + "\n";
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "body<<__RN_EOF__\n" + full + "__RN_EOF__\n");
          console.log("release notes resolved for v" + used + " (" + full.length + " chars)");
          NODE_EOF
          node "$RUNNER_TEMP/relnotes.cjs"

      - name: 发布 .deb 到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag_name != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: PulseBox ${{ inputs.tag_name || github.ref_name }}
          files: demo/target/pulsebox-agent_*.deb
          generate_release_notes: false
          body: ${{ steps.relnotes.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

