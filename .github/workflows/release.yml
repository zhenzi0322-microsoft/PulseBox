name: build-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: '要创建 / 更新的 Release tag（手动触发时填写；tag 推送触发可留空）'
        required: false
        default: ''
        type: string   # 显式声明单行文本框，网页显示输入框

# 同一分支/PR 的重复触发自动取消旧运行，节省 CI 时间
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---- Windows：桌面端 + 核心库全量构建 ----
  windows:
    runs-on: windows-latest
    steps:
      - name: Clone Codeup private repo into demo
        env:
          CODEUP_TOKEN: ${{ secrets.CODEUP_TOKEN }}
        run: |
          git clone "https://oauth2:${env:CODEUP_TOKEN}@codeup.aliyun.com/zheniz0322/Rust/tauri/PulseBox.git" demo
        shell: pwsh
      
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build          # vue-tsc 类型检查 + vite 构建
      - run: cargo test --workspace  # 含 Tauri 桌面端（headless 即可，仅编译+单测）

      - name: 构建 Agent 与桌面端
        run: cargo build --release -p pulsebox-agent -p pulsebox-desktop

  # ---- Ubuntu：把 pulsebox-agent 打包成 .deb，可直接在服务器安装运行 ----
  ubuntu-agent-deb:
    runs-on: ubuntu-latest
    steps:
      # 拉取仓库：与 Windows 作业完全一致的方式（Codeup 私有仓 → demo），保持不变
      - name: Clone Codeup private repo into demo
        env:
          CODEUP_TOKEN: ${{ secrets.CODEUP_TOKEN }}
        run: |
          git clone "https://oauth2:${CODEUP_TOKEN}@codeup.aliyun.com/zheniz0322/Rust/tauri/PulseBox.git" demo

      - name: 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential pkg-config ca-certificates curl dpkg-dev

      - uses: dtolnay/rust-toolchain@stable

      # Agent 是纯 HTTP/WS 服务，使用 rustls（见 build-deb.sh），无需 libssl-dev
      - name: 运行 Agent / Core 单元测试（Linux 路径校验）
        working-directory: demo
        run: cargo test -p pulsebox-agent -p pulsebox-core

      - name: 构建并打包 Agent (.deb)
        working-directory: demo
        env:
          VERSION: ${{ inputs.tag_name || github.ref_name }}
        run: |
          chmod +x scripts/build-deb.sh
          ./scripts/build-deb.sh

      - name: 上传 .deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: pulsebox-agent-deb
          path: demo/target/pulsebox-agent_*.deb
          if-no-files-found: error
